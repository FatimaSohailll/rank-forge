{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="auth card">
  <h1>Create your account</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/signup">
    <label>Username <input name="username" value="{{ username }}" autocomplete="username" required minlength="3" maxlength="32" pattern="[a-z0-9_]{3,32}" autofocus>
      <small class="muted">lowercase letters, digits, underscore</small></label>
    <label>Site or display name (optional) <input name="display_name" value="{{ display_name }}" maxlength="80"></label>
    <label>Password <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="200"></label>
    <button class="btn" type="submit">Create account</button>
  </form>
  <p class="muted">Already have one? <a href="/login">Log in</a></p>
</section>
{% endblock %}
